# 生產環境完整配置
# 使用方式: docker-compose -f docker-compose.prod.yml up -d
#
# 特點：
# - 完整的服務定義，不需要合併 docker-compose.yml
# - knowledge-admin-web 使用預構建的 dist 目錄（僅綁定 80 端口）
# - 移除開發環境的代碼熱重載
# - 移除 pgAdmin（生產環境不需要）
#
# 前置步驟：
# 1. 在本地構建前端：
#    cd knowledge-admin/frontend
#    npm install
#    npm run build
# 2. 上傳整個項目到伺服器（包含 dist 目錄）
# 3. 設置環境變數（.env 文件）
# 4. 執行: docker-compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL 資料庫 with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aichatbot-postgres
    environment:
      TZ: Asia/Taipei
      POSTGRES_USER: aichatbot
      POSTGRES_PASSWORD: aichatbot_password
      POSTGRES_DB: aichatbot_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init seed 已除役（凍結於早期架構、資料過時）——新環境建置走 dump 還原（runbook 附錄 A）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aichatbot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis (用於緩存和任務隊列)
  redis:
    image: redis:7-alpine
    container_name: aichatbot-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Embedding API Service
  embedding-api:
    build: ./embedding-service
    container_name: aichatbot-embedding-api
    environment:
      TZ: Asia/Taipei
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5001:5000"
    depends_on:
      - redis
    restart: unless-stopped

  # 知識庫管理後台 - API
  knowledge-admin-api:
    build: ./knowledge-admin/backend
    container_name: aichatbot-knowledge-admin-api
    environment:
      TZ: Asia/Taipei
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aichatbot_admin
      DB_USER: aichatbot
      DB_PASSWORD: aichatbot_password
      EMBEDDING_API_URL: http://embedding-api:5000/api/v1/embeddings
      PROJECT_ROOT: /app
      RAG_API_URL: http://rag-orchestrator:8100
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      # 生產環境：只掛載必要的數據目錄和腳本
      - ./knowledge-admin/backend/create_admin.py:/app/create_admin.py:ro
      # app.py 掛載即時生效（admin-api image 建置卡上游 apt 源 404——Dockerfile 修復前的過渡；
      # 修復方向：docker.io 改 docker-ce-cli 或靜態 docker binary）
      - ./knowledge-admin/backend/app.py:/app/app.py:ro
      - ./test_scenarios_smoke.xlsx:/app/test_scenarios_smoke.xlsx:ro
      - ./test_scenarios_full.xlsx:/app/test_scenarios_full.xlsx:ro
      - ./output:/app/output
      - ./scripts:/app/scripts:ro
      # Mount docker socket for running backtest in rag-orchestrator container
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - embedding-api
      - rag-orchestrator
    restart: unless-stopped

  # 知識庫管理後台 - 前端（生產模式）
  knowledge-admin-web:
    image: nginx:alpine
    container_name: aichatbot-knowledge-admin-web
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${WEB_PORT:-80}:80"  # 本地用 8087，線上用 80（透過 .env 設定）
    volumes:
      - ./knowledge-admin/frontend/dist:/usr/share/nginx/html:ro
      # 模板經 image 內建 envsubst 展開至 conf.d/default.conf（RAG_ADMIN_API_KEY 代入）
      - ./knowledge-admin/frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./knowledge-admin/frontend/api-docs.html:/usr/share/nginx/api-docs.html:ro
    environment:
      # 後台 → rag 的服務金鑰（api_keys 表發行；RAG_API_AUTH_ENFORCE 開啟時必填，見 runbook §16）
      RAG_ADMIN_API_KEY: ${RAG_ADMIN_API_KEY:-}
    depends_on:
      - knowledge-admin-api
    restart: unless-stopped

  # RAG Orchestrator
  rag-orchestrator:
    build: ./rag-orchestrator
    container_name: aichatbot-rag-orchestrator
    environment:
      TZ: Asia/Taipei
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # presales 葉答案/自由問答合成模型（可獨立切換）
      # 2026-08-26 業主定案「統一 mini」：預設由 gpt-4o 改為 gpt-4o-mini。
      # ⚠️ 這是 **production brain** 的組態變更，會位移所有面向的答話；
      #    C4b/M3 的取證必須跑在與此處一致的模型上（見 end-to-end-roadmap.md §二）。
      PRESALES_SYNTH_MODEL: ${PRESALES_SYNTH_MODEL:-gpt-4o-mini}
      # 意圖分類器配置
      INTENT_CLASSIFIER_MODEL: ${INTENT_CLASSIFIER_MODEL:-gpt-3.5-turbo}
      INTENT_CLASSIFIER_TEMPERATURE: ${INTENT_CLASSIFIER_TEMPERATURE:-0.1}
      INTENT_CLASSIFIER_MAX_TOKENS: ${INTENT_CLASSIFIER_MAX_TOKENS:-500}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aichatbot_admin
      DB_USER: aichatbot
      DB_PASSWORD: aichatbot_password
      EMBEDDING_API_URL: http://embedding-api:5000/api/v1/embeddings
      KNOWLEDGE_GEN_MODEL: ${KNOWLEDGE_GEN_MODEL:-gpt-3.5-turbo}
      DOCUMENT_CONVERTER_MODEL: ${DOCUMENT_CONVERTER_MODEL:-gpt-4o-mini}
      # Redis 緩存配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # R7.2 分數平移量測探針（retrieval-decision-layer D-13）：**預設空＝完全 no-op**。
      # 僅供平移基線量測時以 SCORE_SHIFT_PROBE=0.10 起容器；量完必須拿掉。
      # 生效時 base_retriever 會在每次檢索印警語，防止忘了關而汙染正式量測。
      SCORE_SHIFT_PROBE: ${SCORE_SHIFT_PROBE:-}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_QUESTION: ${CACHE_TTL_QUESTION:-3600}
      CACHE_TTL_VECTOR: ${CACHE_TTL_VECTOR:-7200}
      CACHE_TTL_RAG_RESULT: ${CACHE_TTL_RAG_RESULT:-1800}
      # LLM 答案合成配置
      # 分數欄位語意（詳見 docs/architecture/retriever-pipeline.md）：
      #   vector_similarity = 純向量 cosine；similarity = final 組合分數（含 rerank/boost）
      # JGB 系統 API
      JGB_API_BASE_URL: ${JGB_API_BASE_URL:-https://preview.jgbsmart.com}
      JGB_API_KEY: ${JGB_API_KEY:-}
      USE_MOCK_JGB_API: ${USE_MOCK_JGB_API:-true}
      ENABLE_ANSWER_SYNTHESIS: ${ENABLE_ANSWER_SYNTHESIS:-true}
      ENABLE_LLM_OPTIMIZATION: ${ENABLE_LLM_OPTIMIZATION:-true}
      SYNTHESIS_THRESHOLD: ${SYNTHESIS_THRESHOLD:-0.99}  # 比對 final similarity（_should_synthesize 合成觸發判定）
      PERFECT_MATCH_THRESHOLD: ${PERFECT_MATCH_THRESHOLD:-0.90}  # 比對 vector_similarity（純向量分數）— 重構後閾值語意改變，需校準
      SYNTHESIS_MIN_RESULTS: ${SYNTHESIS_MIN_RESULTS:-2}
      SYNTHESIS_MAX_RESULTS: ${SYNTHESIS_MAX_RESULTS:-3}
      SOP_SIMILARITY_SCORE: ${SOP_SIMILARITY_SCORE:-0.70}
      # RAG 檢索配置 - ✅ 選項1：統一檢索閾值（移除獨立 RAG fallback）
      SOP_SIMILARITY_THRESHOLD: ${SOP_SIMILARITY_THRESHOLD:-0.75}  # 比對 final similarity（application 端過濾 SOP 候選）
      KB_SIMILARITY_THRESHOLD: 0.65  # 比對 final similarity（application 端過濾知識庫候選，涵蓋原 fallback 範圍）
      # PRESALES_EXTRACTIVE: "1"  # presales-grounding-gate D6 事實題抽取式作答；業主 2026-09-04 裁預設關（先補知識再考慮），要開再取消註解
      PRESALES_GROUNDING_THRESHOLD: 0.5  # presales-grounding-gate D2（業主 2026-09-04）：售前 grounding 專用門檻；20 題掃描無知識題最高 0.337、有知識題最低 0.534，0.65 誤擋「電子發票」等有知識題
      HIGH_QUALITY_THRESHOLD: ${HIGH_QUALITY_THRESHOLD:-0.8}  # 比對 final similarity（高品質判定，用於答案合成觸發）
      FALLBACK_SIMILARITY_THRESHOLD: 0.55  # ⚠️ 已廢棄：RAG Fallback 已移除，統一使用 KB_SIMILARITY_THRESHOLD
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.6}  # ⚠️ 已廢棄：待移除
      RAG_TOP_K: ${RAG_TOP_K:-5}
      # 信心度評估配置
      CONFIDENCE_HIGH_THRESHOLD: ${CONFIDENCE_HIGH_THRESHOLD:-0.85}
      CONFIDENCE_MEDIUM_THRESHOLD: ${CONFIDENCE_MEDIUM_THRESHOLD:-0.70}
      # 知識優先級配置
      PRIORITY_BOOST: ${PRIORITY_BOOST:-0.15}
      PRIORITY_QUALITY_THRESHOLD: ${PRIORITY_QUALITY_THRESHOLD:-0.70}
      # 質量評估配置
      QUALITY_EVALUATION_ENABLED: ${QUALITY_EVALUATION_ENABLED:-true}
      QUALITY_EVALUATION_THRESHOLD: ${QUALITY_EVALUATION_THRESHOLD:-6}
      # Semantic Reranker 效能調校（見 .kiro/issues/reranker-returning-zero.md）
      # bge-reranker-base CPU 推論大批次慢，以下參數避免 client timeout
      RERANKER_INPUT_LIMIT: ${RERANKER_INPUT_LIMIT:-20}                        # 送進 reranker 的候選數上限
      RERANKER_MIN_VECTOR_SIMILARITY: ${RERANKER_MIN_VECTOR_SIMILARITY:-0.3}   # vector 下限（過濾不可能進 top_k 的低分）
      RERANKER_HTTP_TIMEOUT: ${RERANKER_HTTP_TIMEOUT:-60}                      # HTTP client timeout（秒）
      # 條件式優化配置
      FAST_PATH_THRESHOLD: ${FAST_PATH_THRESHOLD:-0.75}
      TEMPLATE_MIN_SCORE: ${TEMPLATE_MIN_SCORE:-0.55}
      TEMPLATE_MAX_SCORE: ${TEMPLATE_MAX_SCORE:-0.75}
      LLM_PARAM_INJECTION_TEMP: ${LLM_PARAM_INJECTION_TEMP:-0.1}
      LLM_SYNTHESIS_TEMP: ${LLM_SYNTHESIS_TEMP:-0.1}
      # 意圖建議配置
      INTENT_SUGGESTION_TEMP: ${INTENT_SUGGESTION_TEMP:-0.2}
      INTENT_SUGGESTION_MAX_TOKENS: ${INTENT_SUGGESTION_MAX_TOKENS:-800}
      # 知識生成配置
      KNOWLEDGE_GEN_TEMPERATURE: ${KNOWLEDGE_GEN_TEMPERATURE:-0.7}
      KNOWLEDGE_GEN_MAX_TOKENS: ${KNOWLEDGE_GEN_MAX_TOKENS:-800}
      # LLM 答案優化配置
      LLM_ANSWER_TEMPERATURE: ${LLM_ANSWER_TEMPERATURE:-0.7}
      LLM_ANSWER_MAX_TOKENS: ${LLM_ANSWER_MAX_TOKENS:-800}
      # 未釐清問題配置
      UNCLEAR_SEMANTIC_THRESHOLD: ${UNCLEAR_SEMANTIC_THRESHOLD:-0.80}
      UNCLEAR_PINYIN_THRESHOLD: ${UNCLEAR_PINYIN_THRESHOLD:-0.80}
      # AWS S3 影片儲存配置
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      # Query Rewriting（查詢改寫）
      ENABLE_QUERY_REWRITE: ${ENABLE_QUERY_REWRITE:-false}
      QUERY_REWRITE_MODEL: ${QUERY_REWRITE_MODEL:-gpt-4o-mini}
      QUERY_REWRITE_TEMPERATURE: ${QUERY_REWRITE_TEMPERATURE:-0}
      # b2b 停用改寫（A/B 實測零差異）；b2c/SOP 未測維持啟用
      ENABLE_QUERY_REWRITE_B2B: ${ENABLE_QUERY_REWRITE_B2B:-false}
      # rerank 融合權重對照回測用（2026-09-03）；空＝程式預設 0.9，與舊碼逐位元相同
      RERANK_FUSION_WEIGHT: ${RERANK_FUSION_WEIGHT:-}
      # pre-entry routability gate（entry-scoped 實驗，預設關）
      PREENTRY_ROUTABILITY_GATE: ${PREENTRY_ROUTABILITY_GATE:-false}
      # S1-B：responsibility observation（⛔ 零 authority；預設關閉）
      RESPONSIBILITY_TELEMETRY: ${RESPONSIBILITY_TELEMETRY:-false}
      # S2：authority handoff 的 migration allowlist（空＝不啟用任何 handoff）
      RESPONSIBILITY_MIGRATION_ALLOWLIST: ${RESPONSIBILITY_MIGRATION_ALLOWLIST:-}
      # ⚠️ 下面三個旗標**必須宣告**，否則 compose 不會把 .env 的值傳進容器——
      #    Stage-1 會在「旗標看起來設了、實際沒生效」的狀態下上線（fail-safe 停用）。
      #    本專案已三次因 runner／env 保真度不足而結論作廢，故一律顯式宣告。
      # 進場委派 resolver 的面向白名單：GATE=true **且** 面向列於此才啟用；
      # 只開 GATE 不設白名單 ＝ fail-safe 停用（見 routers/chat.py:831）
      PREENTRY_ROUTABILITY_FACETS: ${PREENTRY_ROUTABILITY_FACETS:-}
      # 任務 8：action 越界時呼叫端是否仍依 scope 行動（預設 off，需獨立驗收）
      FACET_SCOPE_SALVAGE: ${FACET_SCOPE_SALVAGE:-false}
      # conversational-step 的 strict json_schema 輸出契約（預設 on；false 回退 json_object）
      BRAIN_STRICT_SCHEMA: ${BRAIN_STRICT_SCHEMA:-true}
      # Reranker 配置（2026-01-28）
      ENABLE_RERANKER: ${ENABLE_RERANKER:-true}
      ENABLE_KNOWLEDGE_RERANKER: ${ENABLE_KNOWLEDGE_RERANKER:-true}
      # 語義重排序配置（2026-02-06）
      USE_SEMANTIC_RERANK: ${USE_SEMANTIC_RERANK:-true}
      SEMANTIC_MODEL_API_URL: http://semantic-model:8000
      # 表單觸發配置
      FORM_TRIGGER_THRESHOLD: ${FORM_TRIGGER_THRESHOLD:-0.75}
      # 回測系統配置
      BACKTEST_BASE_URL: ${BACKTEST_BASE_URL:-http://rag-orchestrator:8100}
      # 多輪模擬器情境卡綁定的測試角色（37305 有租約中/刊登中物件與電表真資料）
      BACKTEST_ROLE_ID: ${BACKTEST_ROLE_ID:-37305}
      # 圖片辨識配置（2026-04-28）
      ENABLE_IMAGE_RECOGNITION: ${ENABLE_IMAGE_RECOGNITION:-false}
      # ⚠️ 視覺模型：mini 支援 vision，但辨識信心會下降，而修繕預填是
      #    **依 Vision 信心分型**決定要不要直接填槽（services/jgb/repair_prefill.py）。
      #    統一 mini 後，低信心 → 退化為候選讓使用者選的比例預期會上升。
      IMAGE_RECOGNITION_MODEL: ${IMAGE_RECOGNITION_MODEL:-gpt-4o-mini}
      IMAGE_RECOGNITION_DETAIL: ${IMAGE_RECOGNITION_DETAIL:-low}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-1024}
      IMAGE_COMPRESS_QUALITY: ${IMAGE_COMPRESS_QUALITY:-85}
      # API Key 認證（開啟前 jgb2 前端須已帶 X-API-Key，否則現役 b2b 直接斷線）
      RAG_API_AUTH_ENFORCE: ${RAG_API_AUTH_ENFORCE:-false}
      # ⚠️ agentic-mcp-orchestration 1.7：/mcp 的 Origin 白名單，**必須明示**——
      #    未設定（連這行也拿掉）app 會啟動即 raise。`-` ＝ 空集合 ＝
      #    「任何帶 Origin 的請求都拒」，這是 server-to-server 門面的正確預設；
      #    缺 Origin 的請求（server-to-server client 不送）不受影響、照放行。
      #    ⛔ 不可為了「讓瀏覽器連得上」而放寬——/mcp 僅 server-to-server。
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:--}
      # agentic-mcp 開關（M1 影子／M3 切換；全部預設關，見 runbook §19-5）
      AGENT_STAGE: ${AGENT_STAGE:-M0}
      AGENT_AUDIENCES: ${AGENT_AUDIENCES:-}
      AGENT_SHADOW_AUDIENCES: ${AGENT_SHADOW_AUDIENCES:-}
      AGENT_SHADOW_MONTHLY_USD_CAP: ${AGENT_SHADOW_MONTHLY_USD_CAP:-50}
      AGENT_TURN_ENABLED: ${AGENT_TURN_ENABLED:-false}
      # agentic-mcp-orchestration 其餘新 env（runbook §19-5 逐一 grep 核對名稱／預設值）——
      # 全部維持不宣告＝吃程式內建預設；里程碑推進時才在 .env 加對應鍵覆寫，⛔ 不在此處預先宣告：
      #   AGENT_STAGE（預設 M0；部署里程碑，M0-M5）
      #   AGENT_AUDIENCES（預設空；M3 才開 AGENT_AUDIENCES=prospect，管 REST 入口）
      #   AGENT_TURN_ENABLED（預設 false；/mcp 的 agent.turn 工具回切開關，與 AGENT_AUDIENCES 互不管轄）
      #   AGENT_TURN_TIMEOUT_S（預設 30 秒）／AGENT_TURN_CAP（預設 120/小時/(api_key_id,vendor_id)）
      #   AGENT_SHADOW_AUDIENCES（預設空；M2 影子評估用）
      #   AGENT_SHADOW_MONTHLY_USD_CAP（預設 50 USD；超過自動關並告警）
      #   AGENT_OUTLINE_TOKEN_LIMIT_PROSPECT（預設 10000）／_PM（預設 8000）／_TENANT（預設 8000）
      #   AGENT_MODEL（未設回退 OPENAI_MODEL，再無則 gpt-4o-mini）
      #   AGENT_TRACE_WINDOW_DAYS（預設 7；agent_trace 查詢時間窗）
      #   RATE_PER_MIN（預設 60/分鐘/(api_key_id,vendor_id)；一般 MCP 工具速率）
      #   KB_GET_CAP（預設 300/小時/key；kb.get 上限）
      #   JGB2_CANDIDATE_CAP（預設 5；jgb2.query.* 候選列筆數）
      #   AGENT_BUDGET_TOOL_CALLS／AGENT_BUDGET_REWRITES／AGENT_BUDGET_DEADLINE_S（預設 4／2／20.0；bootstrap.budget_from_env 讀取）
      # usage-metering 使用量計量（2026-07-06；預設開，關=零行為差異）
      USAGE_METERING_ENABLED: ${USAGE_METERING_ENABLED:-true}
      LLM_PRICING_PATH: ${LLM_PRICING_PATH:-}
      USAGE_RETENTION_MONTHS: ${USAGE_RETENTION_MONTHS:-18}
      # quota-management 額度警示寄信（SMTP 未設僅記 log 不寄）
      QUOTA_SMTP_HOST: ${QUOTA_SMTP_HOST:-}
      QUOTA_SMTP_PORT: ${QUOTA_SMTP_PORT:-587}
      QUOTA_SMTP_USER: ${QUOTA_SMTP_USER:-}
      QUOTA_SMTP_PASS: ${QUOTA_SMTP_PASS:-}
      QUOTA_SMTP_FROM: ${QUOTA_SMTP_FROM:-}
      QUOTA_WARN_EMAIL_TO: ${QUOTA_WARN_EMAIL_TO:-}
      QUOTA_WARN_IN_CHAT: ${QUOTA_WARN_IN_CHAT:-false}
      # 參數雙源切換（預設 configs；true 才改讀 lookup——2026-07-06 分工定案後保留開關）
      VENDOR_PARAMS_FROM_LOOKUP: ${VENDOR_PARAMS_FROM_LOOKUP:-false}
      # DSP-033：Verifier 步③的 NLI 接地檢查（⛔ 服務不可用只降級、不轉人）。
      # ⚠️ 三個值都**顯式宣告**：`NLI_URL` 是容器視角的位置，落回程式預設也一樣，
      #    但宣告出來才看得見它指向哪裡；逾時＝對數 × NLI_PAIR_TIMEOUT_MS（唯一公式）。
      NLI_URL: http://nli-model:8000
      NLI_MAX_PAIRS: ${NLI_MAX_PAIRS:-12}
      NLI_PAIR_TIMEOUT_MS: ${NLI_PAIR_TIMEOUT_MS:-400}
    ports:
      - "8100:8100"
    depends_on:
      - postgres
      - embedding-api
      - redis
      - semantic-model
      - nli-model
    restart: unless-stopped

  # 語義重排序模型服務（2026-02-06）
  semantic-model:
    build: ./semantic_model
    container_name: aichatbot-semantic-model
    ports:
      # DSP-033 P2-4／F-13：綁 127.0.0.1，⛔ 不再對外網卡發佈。
      # ⚠️ 主機端仍連得到 `http://localhost:8002/`（`.kiro/specs/routing-disambiguation/tasks.md`
      #    的 runbook curl、`semantic_model/README.md` 的範例都是 localhost），
      #    改的只有「從別台機器連得到」這件事——那從來不是預期用途。
      #    ⚠️ 容器之間走的是 compose 網路（`SEMANTIC_MODEL_API_URL: http://semantic-model:8000`），
      #    與本行無關；rag-orchestrator／backtest／pipeline_health 三個消費端讀的都是那個 env。
      - "127.0.0.1:8002:8000"
    environment:
      TZ: Asia/Taipei
      MODEL_NAME: BAAI/bge-reranker-base
      MAX_LENGTH: 512
      BATCH_SIZE: 32
    # DSP-033 r18 F-9：兩個模型容器都要有上限，否則 nli-model 的 1 GB 只是把
    # OOM 的風險整包推給沒有上限的那一個。部署前量兩者常駐 RSS 進 runbook。
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      # image 無 curl（2026-07-07 部署實測 unhealthy 誤報）→ 改用 python 內建 urllib
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # NLI 接地檢查服務（DSP-033）——Verifier 步③的蘊涵分數來源。
  # ⛔ **不掛在 semantic-model**（P1-3）：其 `/rerank` 是 async def 內同步 predict、
  #    單 worker，掛進去會 head-of-line blocking，把 reranker 的 p95 一起拖垮。
  nli-model:
    build:
      context: ./nli_model
      args:
        # ⚠️ 首次建置時把 model_fingerprint.py 印出的值填進來（它會先失敗並告訴你），
        #    然後 commit 這一行。⛔ 留空會讓建置失敗，那是刻意的 fail-closed。
        NLI_MODEL_SHA256: ${NLI_MODEL_SHA256:-}
    container_name: aichatbot-nli-model
    environment:
      TZ: Asia/Taipei
    # DSP-033 P2-4：⛔ **不對主機發佈埠**——只走 compose 網路。
    # 這個服務吃的是知識庫原文與模型輸出，沒有任何理由讓它從主機可達。
    # r18 F-9：1 GB 上限（110M 參數 CPU 推論；部署前量常駐 RSS 進 runbook）。
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      # 映像無 curl（同 semantic-model 2026-07-07 的坑）→ python urllib。
      # ⚠️ 探的是 `/health` 回得出東西，**不是** `nli_ready`——canary 或指紋沒過時
      #    我們要的是「容器活著、health 說得出為什麼」，而不是 compose 反覆重啟它。
      #    `nli_ready=false` 由 agent health 判紅（F-10）。
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  postgres_data:
  redis_data:
