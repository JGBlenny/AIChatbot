# docker-compose.dev.yml — 測試／開發專用（spec testing-traceability・元件 2・D1）
#
# 用途：在 Python 3.11 容器（對齊執行期）內跑 pytest，使「測試環境＝執行期」。
#   - 掛載源碼 `./rag-orchestrator:/app` → 改碼即跑、免 rebuild。
#   - 測試以 `docker compose -f docker-compose.dev.yml run --rm`（本地與 CI 同一入口），
#     不用 `docker exec`（避免假設常駐容器）。
#   - 不影響 prod：不重用 prod 的 container_name 與 host ports。
#
# 典型用法（建議透過 scripts/run-tests.sh / make test）：
#   docker compose -f docker-compose.dev.yml run --rm rag-orchestrator \
#     sh -c "pip install -q -r requirements-test.txt && python3 -m pytest -m unit"
#
# 註：unit 層全 mock、可離線，不需 postgres/redis；integration/e2e 由 CI（service
#     containers）或本地既有 prod 堆疊提供真實相依，未提供時對應測試標示略過（R4.5）。

# 獨立 project 名稱，避免與 prod（docker-compose.prod.yml）共用 namespace 而誤報 orphan。
name: aichatbot-test

services:
  rag-orchestrator:
    build: ./rag-orchestrator
    image: aichatbot-rag-orchestrator-test
    working_dir: /app
    volumes:
      - ./rag-orchestrator:/app          # 掛載源碼：改碼即跑、免 rebuild
      # 凍結語料與雜訊標記（retrieval-decision-layer R1.1/1.4）：decision_replay 的
      # unit 測試要對真語料驗標記，唯讀掛入即可（容器內 /app 的上兩層恰為 /）。
      - ./docs:/docs:ro
      # spec 正文（retrieval-decision-layer R1.3.2）：測試要核對 verdict 值域
      # 與 design.md C1 枚舉逐字一致，唯讀掛入。
      - ./.kiro:/.kiro:ro
      # ⚠️ env parity 契約（_meta）要**逐行讀兩份 compose 的宣告**才驗得動。
      # 沒有這兩行時 `_meta/test_env_parity_req.py` 會 FileNotFoundError 而恆紅——
      # 那不是產品缺陷，是**測試環境保真度缺陷**：測試拿不到它宣稱要驗的證據。
      # 掛在根層是為了對齊 /app 的上兩層（同 ./docs、./.kiro 的既有慣例）。
      - ./docker-compose.prod.yml:/docker-compose.prod.yml:ro
      - ./docker-compose.dev.yml:/docker-compose.dev.yml:ro
      # 同理：runner 層契約（第三層）要純文字解析 run-tests.sh 與 CI workflow。
      - ./scripts:/scripts:ro
      - ./.github:/.github:ro
    # ⚠️ **行為設定必須與 production 同源**（任務 3.1 實跑逼出｜R9.4）：
    #    測試容器原本完全不帶 .env，於是 KB_SIMILARITY_THRESHOLD 未設 →
    #    DecisionConfig 落回程式預設 **0.55**，而 production 容器實際跑 **0.65**。
    #    同一組測試在兩個門檻下候選集不同、紅的題目也不同——
    #    用錯門檻做的對照會得出完全相反的結論（本專案已三次因 runner 保真度不足而結論作廢）。
    #    故：**行為設定（門檻／旗標／模型）走 env_file 與 production 同源**；
    #        **連線類設定（DB_*／REDIS_*）由下方 environment 覆蓋**——
    #        .env 裡的連線值是**宿主視角**（localhost、aichatbot_admin），容器內必須另給。
    #    docker compose 語義：environment 優先於 env_file，故覆蓋成立。
    env_file:
      - .env
    environment:
      TZ: Asia/Taipei
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app
      # integration/e2e 的真實相依連線（unit 層全 mock 不需要）。
      #
      # ⚠️ **一律用 TEST_ 前綴的覆蓋鍵，不得沿用 DB_HOST／DB_NAME 等裸名**
      #    （任務 2.4 實測逼出）：docker compose 會自動載入專案根目錄的 `.env`，
      #    而該檔是**宿主視角**——其中 `DB_HOST=localhost`、`DB_NAME=aichatbot_admin`。
      #    用裸名做預設（`${DB_NAME:-aichatbot_test}`）會被 `.env` 直接蓋掉：
      #    容器內 `localhost` 指向容器自己（連不到 postgres），
      #    而 `aichatbot_admin` 是 **production 庫**——正是 fail-closed 守門要擋的目標。
      #    改用 `.env` 不會定義的 TEST_* 鍵，即與宿主組態徹底解耦。
      DB_HOST: ${TEST_DB_HOST:-postgres}
      DB_PORT: ${TEST_DB_PORT:-5432}
      # 測試庫（任務 2.3）：守門只放行白名單內的測試庫；供裝見 scripts/provision-test-db.sh
      DB_NAME: ${TEST_DB_NAME:-aichatbot_test}
      # 執行環境宣告（任務 2.2）：守門缺值即拒絕——「未設」不是「未知」而是「未證明」
      DB_ENV: ${TEST_DB_ENV:-test}
      DB_USER: ${TEST_DB_USER:-aichatbot}
      DB_PASSWORD: ${TEST_DB_PASSWORD:-aichatbot_password}
      REDIS_HOST: ${TEST_REDIS_HOST:-redis}
      REDIS_PORT: ${TEST_REDIS_PORT:-6379}
      # ── 服務位置：**一律容器視角，覆蓋 .env 的宿主視角** ──
      # .env 寫 EMBEDDING_API_URL=http://localhost:5001/...（宿主）；
      # 容器內 localhost 指向容器自己 → 向量檢索整組失效 → 檢索回空 →
      # 「應進對話」的案例全數變單發。與 DB_HOST 是同一類 bug，只是換了服務。
      # （2026-08-23 實跑逼出：加 env_file 後 59 筆進場案例集體轉紅。）
      EMBEDDING_API_URL: http://embedding-api:5000/api/v1/embeddings
      SEMANTIC_MODEL_API_URL: http://semantic-model:8000
      # ── routing 行為參數：**逐字鏡射 docker-compose.prod.yml 的宣告** ──
      # 不可只靠 env_file 巧合對上：prod 有些參數是在 compose 內以 ${VAR:-default}
      # 宣告而 .env 並未定義（如 FORM_TRIGGER_THRESHOLD），測試容器若落回程式預設，
      # 只是「碰巧同值」，任一邊改動即靜默分歧。
      # 由 tests/unit/_meta/test_env_parity_req.py 鎖住兩份 compose 的一致性。
      KB_SIMILARITY_THRESHOLD: 0.65
      FORM_TRIGGER_THRESHOLD: ${FORM_TRIGGER_THRESHOLD:-0.75}
      ENABLE_QUERY_REWRITE_B2B: ${ENABLE_QUERY_REWRITE_B2B:-false}
      PREENTRY_ROUTABILITY_GATE: ${PREENTRY_ROUTABILITY_GATE:-false}
      # ⚠️ 下面三個旗標**必須宣告**，否則 compose 不會把 .env 的值傳進容器——
      #    Stage-1 會在「旗標看起來設了、實際沒生效」的狀態下上線（fail-safe 停用）。
      #    本專案已三次因 runner／env 保真度不足而結論作廢，故一律顯式宣告。
      # 進場委派 resolver 的面向白名單：GATE=true **且** 面向列於此才啟用；
      # 只開 GATE 不設白名單 ＝ fail-safe 停用（見 routers/chat.py:831）
      PREENTRY_ROUTABILITY_FACETS: ${PREENTRY_ROUTABILITY_FACETS:-}
      # 任務 8：action 越界時呼叫端是否仍依 scope 行動（預設 off，需獨立驗收）
      FACET_SCOPE_SALVAGE: ${FACET_SCOPE_SALVAGE:-false}
      # conversational-step 的 strict json_schema 輸出契約（預設 on；false 回退 json_object）
      BRAIN_STRICT_SCHEMA: ${BRAIN_STRICT_SCHEMA:-true}
      # ── LLM 模型參數：**逐字鏡射 prod**（C4b 凍結參數，spec conversational-routing-execution 6.1/③）──
      # 逐字鏡射 prod compose 的宣告——**唯一目的是讓測試容器的 brain 與 production 同款**。
      # 2026-08-26 業主定案「統一 mini」後兩邊同為 gpt-4o-mini；
      # ⚠️ 這一行仍不可刪：prod 若日後改回別的模型，這裡沒鏡射就會靜默落回 OPENAI_MODEL，
      #    C4b 又會在「不是 production 的 brain」上取證（本專案已三次因此結論作廢）。
      # 與 KB_SIMILARITY_THRESHOLD 是同一類 runner 保真度 bug，只是換了參數。
      PRESALES_SYNTH_MODEL: ${PRESALES_SYNTH_MODEL:-gpt-4o-mini}
      # ⚠️ 逐字鏡射 prod（agentic-mcp-orchestration 1.7）：未宣告時 `import app`
      #    會啟動即 raise（MCP_ALLOWED_ORIGINS 必須明示），e2e／integration 全紅。
      #    `-` ＝ 空集合 ＝ 任何帶 Origin 的請求都拒；缺 Origin 者照放行。
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:--}
    command: ["sleep", "infinity"]        # 維持容器；測試以 run --rm 進入

# 接上共用基礎設施網路（spec conversational-routing-execution 任務 1.2｜R1.2）
# 已實查：aichatbot_default 上 postgres 服務帶有 alias `postgres`，
# 故 DB_HOST 預設值無須改動即可解析。
networks:
  default:
    name: aichatbot_default
    external: true
