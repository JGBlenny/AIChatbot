# CI 測試把關（spec testing-traceability 元件 6・R4・D2）
# unit 層為硬把關（容器內 3.11、可離線）；覆蓋率 ratchet 守門；追溯掃描產報告 artifact。
# integration 層起 postgres/redis 嘗試執行（非阻擋，避免在 schema/seed 尚未就緒前假紅/假綠）；
# e2e 不在 CI 跑（未設 RUN_E2E）→ 標示略過，不假綠燈（R4.5）。
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: unit + coverage + traceability（硬把關）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit 測試（容器內 3.11）＋覆蓋率
        run: scripts/run-tests.sh unit --cov

      - name: 覆蓋率 ratchet 守門（CI 只讀，低於基準→fail）
        run: python3 rag-orchestrator/tools/coverage/check_baseline.py

      - name: 追溯掃描（產報告＋缺口警示，預設不硬擋）
        run: |
          python3 rag-orchestrator/tools/traceability/scan.py
          echo "ℹ️ 追溯為漸進式門檻：缺口以警示為主（R8.3/8.4），如需硬擋可在此加判斷。"

      - name: 上傳追溯報告與覆蓋率 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-and-coverage
          path: |
            .kiro/specs/testing-traceability/traceability-matrix.md
            .kiro/specs/testing-traceability/traceability-matrix.json
            rag-orchestrator/tests/.coverage.json
          if-no-files-found: warn

  integration:
    name: integration（真實相依，非阻擋）
    runs-on: ubuntu-latest
    # 不阻擋合併：DB schema/seed 完整供裝為後續工作；在此先驗證相依可起與接線，
    # 而非在未就緒時假紅或假綠（透明標示，符合 R4.5「略過而非通過」精神）。
    #
    # ⚠️ `continue-on-error: true` 已移除（spec conversational-routing-execution 任務 1.6｜R1.4）。
    #    它在 **job 級**吞噬，會連結構性失效的 exit 1 一起吃掉，使守門在 CI 完全沒有訊號。
    #    「測試沒過不阻擋」的既有意圖改由下方 step 級的退出碼判斷達成，語義更精確：
    #      rc=10（空跑守門／DB 守門失敗）→ 硬擋；其餘 → 不擋。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # 測試庫名（任務 2.3）：雖為臨時 service container，仍不得沿用 production 庫名——
          # 守門判的是名字，把 aichatbot_admin 加進白名單等於在所有環境解除保護。
          POSTGRES_DB: aichatbot_test
          POSTGRES_USER: aichatbot
          POSTGRES_PASSWORD: aichatbot_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aichatbot"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RUN_INTEGRATION: "1"
      # 空跑守門的 requested-layer 唯一權威來源（任務 1.8）——
      # conftest 不解析 `-m` 推導意圖，由此明示。
      REQUESTED_TEST_LAYERS: "integration"
      # 測試 DB 安全邊界（任務 2.2／2.3）：兩者缺一即被 fail-closed 守門拒絕。
      DB_ENV: "test"
      DB_NAME: "aichatbot_test"
      DB_HOST: localhost
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安裝相依（執行期＋測試）
        run: |
          pip install -q -r rag-orchestrator/requirements.txt
          pip install -q -r rag-orchestrator/requirements-test.txt
      - name: Integration 測試（測試失敗非阻擋；結構性失效硬擋）
        working-directory: rag-orchestrator
        run: |
          echo "⚠️ 注意：完整 DB schema/seed 供裝為後續工作；本步驟先以服務容器嘗試 integration。"
          set +e
          python3 -m pytest -m integration -p no:cacheprovider --tb=short
          rc=$?
          set -e
          # 退出碼語義（tests/conftest.py 定義）：
          #   10 ＝ 結構性失效（旗標沒傳到／被請求層有 gate-skip）
          #        ※ 測試 DB fail-closed 守門（任務 2.1）尚未實作，屆時併入同一個碼
          #        → 這不是「測試沒過」，是「量測工具沒真的跑」，必須硬擋。
          #    3 ＝ pytest 自身 internal error（pytest 保留碼，與上面可區分）
          #    1 ＝ 有測試失敗 → 維持既有的刻意決定：不阻擋。
          if [ "$rc" -eq 10 ]; then
            echo "::error::結構性失效（R1.4）——integration 層未真正執行，或測試 DB 未通過安全守門。"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "integration 尚未全綠（多數需 schema/seed）—非阻擋，待後續供裝。(rc=$rc)"
          fi
          exit 0
